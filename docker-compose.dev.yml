# Development docker-compose: hot-reload API + worker, binds code as volumes.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up
#
# Then visit http://localhost:5173 (Vite) and http://localhost:8000 (API).

name: docformatconverter-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docconv
      POSTGRES_PASSWORD: docconv
      POSTGRES_DB: docconv
    ports: ["5432:5432"]
    volumes: ["pg_dev:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docconv"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_dev:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb -p local/docconv || true) &&
      mc anonymous set none local/docconv
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: postgresql+asyncpg://docconv:docconv@postgres:5432/docconv
      DATABASE_URL_SYNC: postgresql+psycopg2://docconv:docconv@postgres:5432/docconv
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: docconv
      S3_REGION: us-east-1
      CORS_ALLOW_ORIGINS: http://localhost:5173
      STORAGE_BACKEND: s3
      JWT_KEYS_DIR: /app/keys
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe!2024Secure
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app/backend
      - ./entrypoints:/app/entrypoints:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - jwt_keys_dev:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: api

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      <<: &worker-env
        APP_ENV: dev
        APP_DEBUG: "1"
        DATABASE_URL: postgresql+asyncpg://docconv:docconv@postgres:5432/docconv
        REDIS_URL: redis://redis:6379/0
        CELERY_BROKER_URL: redis://redis:6379/1
        CELERY_RESULT_BACKEND: redis://redis:6379/2
        S3_ENDPOINT_URL: http://minio:9000
        S3_ACCESS_KEY: minioadmin
        S3_SECRET_KEY: minioadmin
        S3_BUCKET: docconv
        S3_REGION: us-east-1
        STORAGE_BACKEND: s3
        JWT_KEYS_DIR: /app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./entrypoints:/app/entrypoints:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - jwt_keys_dev:/app/keys
    command: worker

  beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml:ro
      - jwt_keys_dev:/app/keys
    command: beat

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_BASE: http://localhost:8000
      VITE_WS_BASE: ws://localhost:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install -g pnpm && pnpm install && pnpm run dev -- --host 0.0.0.0"

volumes:
  pg_dev:
  minio_dev:
  jwt_keys_dev:
  frontend_node_modules:
