# Pre-commit hooks — runs on `git commit`
# Install: `make install-hooks` (or `pip install pre-commit && pre-commit install`)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch=main", "--branch=master"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: '^(backend|scripts)/.*\.py$'
      - id: ruff-format
        files: '^(backend|scripts)/.*\.py$'

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        files: '^(backend|scripts)/.*\.py$'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: '^backend/.*\.py$'
        additional_dependencies:
          - "pydantic>=2.10.4"
          - "sqlalchemy>=2.0.36"
        args: ["--config-file=pyproject.toml"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "backend/app/"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.0.0
    hooks:
      - id: zizmor
        files: '^\.github/workflows/.*\.ya?ml$'

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast subset)
        entry: bash -c 'cd backend && python -m pytest -q -x --no-cov -m "not slow and not integration"'
        language: system
        pass_filenames: false
        stages: [manual]
