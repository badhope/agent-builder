version: '3.8'

services:
  api:
    build: .
    image: badhope/docformatconverter:latest
    container_name: doc-converter
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DATABASE_URL=postgresql://[REDACTED-DB-PASSWORD]@postgres:5432/docconverter
      - REDIS_URL=redis://redis:6379/0
      - MAX_FILE_SIZE=50MB
      - LOG_LEVEL=INFO
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    command: celery -A tasks worker -l info -c 2
    container_name: doc-converter-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://[REDACTED-DB-PASSWORD]@postgres:5432/docconverter
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: doc-converter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: doc-converter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docconverter
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docconverter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
