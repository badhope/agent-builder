global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: docformatconverter

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: docconv-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:8000
        labels:
          service: docconv-api

  - job_name: docconv-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9801
        labels:
          service: docconv-worker

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
