# Production nginx config — terminate TLS and reverse-proxy to the API and
# the React frontend. The TLS certs are expected to be mounted at
# /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem.
# (cert-manager / Let's Encrypt via the deploy/scripts/issue-cert.sh script.)

upstream docconv_api {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream docconv_frontend {
    server frontend:80 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Rate-limit zone (requires nginx built with --with-http_limit_req_module).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;

# HSTS preload submission
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 200m;
    client_body_buffer_size 1m;
    client_body_timeout 120s;

    # Security headers on error pages
    error_page 495 496 497 https://$host$request_uri;

    # ---- API ----
    location /v1/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://docconv_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # ---- WebSocket ----
    location /ws/ {
        limit_req zone=ws_limit burst=10 nodelay;
        proxy_pass http://docconv_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ---- Operational endpoints (locked to internal subnets) ----
    location ~ ^/(healthz|readyz|metrics|docs|redoc|openapi\.json)$ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://docconv_api;
    }

    # ---- Frontend ----
    location / {
        proxy_pass http://docconv_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
