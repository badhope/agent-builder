apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docconv
  namespace: docformatconverter
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.docformatconverter.example.com]
      secretName: docconv-tls
  rules:
    - host: api.docformatconverter.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docconv-api
                port: { number: 80 }
