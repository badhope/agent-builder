apiVersion: v1
kind: ConfigMap
metadata:
  name: docconv-config
  namespace: docformatconverter
data:
  APP_ENV: "prod"
  APP_DEBUG: "0"
  DATABASE_URL: "postgresql+asyncpg://docconv:CHANGE_ME@postgres:5432/docconv"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  STORAGE_BACKEND: "s3"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_BUCKET: "docconv"
  S3_REGION: "us-east-1"
  CORS_ALLOW_ORIGINS: "https://docformatconverter.example.com"
  JWT_KEYS_DIR: "/app/keys"
  LOG_LEVEL: "INFO"
  RATE_LIMIT_DEFAULT: "120/minute"
---
apiVersion: v1
kind: Secret
metadata:
  name: docconv-secrets
  namespace: docformatconverter
type: Opaque
stringData:
  POSTGRES_USER: docconv
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: docconv
  S3_ACCESS_KEY: CHANGE_ME
  S3_SECRET_KEY: CHANGE_ME
  MINIO_ROOT_USER: CHANGE_ME
  MINIO_ROOT_PASSWORD: CHANGE_ME
  BOOTSTRAP_ADMIN_PASSWORD: CHANGE_ME
  SECRET_KEY: CHANGE_ME_TO_A_LONG_RANDOM_VALUE
