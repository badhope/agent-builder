<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DocFormatConverter</title>
  <script>!function(n){function e(){var e=n.document.documentElement,r=e.getBoundingClientRect().width;e.style.fontSize=r>=640?"40px":r<=320?"20px":r/320*20+"px"}n.addEventListener("resize",(function(){e()})),e()}(window);</script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
