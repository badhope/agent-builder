[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docformatconverter"
version = "1.0.0"
description = "Lightweight multi-format batch document converter with secure async API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "badhope" }]
keywords = ["document", "converter", "pdf", "docx", "pandoc", "libreoffice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    # Web framework
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",

    # Data validation & settings
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "email-validator==2.3.0",

    # Database
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.4",

    # Redis / queue
    "redis[hiredis]==8.0.0",
    "celery[redis]==5.6.3",
    "arq==0.28.0",

    # Security
    "argon2-cffi==25.1.0",
    "pyjwt[crypto]==2.13.0",
    "cryptography==48.0.1",
    "python-jose[cryptography]==3.5.0",

    # Rate limiting
    "slowapi==0.1.9",
    "limits==5.8.0",

    # HTTP / WebSocket clients (server-side use)
    "httpx==0.28.1",
    "websockets==16.0",
    "aiofiles==25.1.0",

    # File type detection
    "python-magic==0.4.27",
    "filetype==1.2.0",

    # Document processing — modern maintained forks
    "pypdf==6.13.1",
    "pdfplumber==0.11.9",
    "pdf2image==1.17.0",
    "pypandoc==1.17",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "python-pptx==1.0.2",
    "odfpy==1.4.1",
    "ebooklib==0.20",
    "markdownify==1.2.2",

    # Data formats
    "pyyaml==6.0.3",
    "lxml==6.1.1",
    "pandas==3.0.3",
    "xmltodict==1.0.4",
    "tomli==2.2.1; python_version < '3.11'",

    # Markup
    "markdown==3.10.2",
    "beautifulsoup4==4.15.0",
    "bleach==6.4.0",

    # Image
    "Pillow==12.2.0",
    "pillow-heif==1.3.0",
    "cairosvg==2.9.0",

    # HTML → PDF
    "weasyprint==69.0",

    # Storage
    "boto3==1.43.26",
    "botocore==1.43.26",

    # Anti-virus (optional at runtime)
    "pyclamd==0.4.0",

    # Observability
    "structlog==26.1.0",
    "prometheus-client==0.25.0",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-sqlalchemy==0.63b1",
    "opentelemetry-instrumentation-redis==0.63b1",
    "opentelemetry-instrumentation-celery==0.63b1",
    "opentelemetry-instrumentation-httpx==0.63b1",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "sentry-sdk[fastapi]==2.62.0",

    # CORS / misc
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
    "orjson==3.11.9",
    "pybase64==1.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "respx==0.23.1",
    "factory-boy==3.3.3",
    "freezegun==1.5.5",
    "black==26.5.1",
    "ruff==0.15.17",
    "mypy==2.1.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pre-commit==4.6.0",
    "types-PyYAML",
    "types-python-dateutil",
]
worker = [
    # Workers may run without web server deps; explicit subset
    "celery[redis]==5.6.3",
    "redis[hiredis]==8.0.0",
    "sqlalchemy[asyncio]==2.0.50",
    "asyncpg==0.31.0",
    "structlog==26.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
]

[project.urls]
Homepage = "https://github.com/badhope/DocFormatConverter"
Issues = "https://github.com/badhope/DocFormatConverter/issues"
Changelog = "https://github.com/badhope/DocFormatConverter/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
exclude = ["tests*", "frontend*", "deploy*", "docs*", "spec*", "archive*"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | var
  | archive
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive", "var", "build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
    "ASYNC",# flake8-async
    "TID",  # tidy imports
    "PT",   # pytest style
    "Q",    # flake8-quotes
    "SIM",  # flake8-simplify
    "PTH",  # use pathlib
    "ERA",  # eradicate commented code
    "PL",   # pylint
    "TRY",  # tryceratops
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913",# too many arguments
    "TRY003", # long messages outside exception class
    "B008",   # function call in default argument (FastAPI uses this a lot)
    "PLC0415",# lazy imports for optional dependencies (intentional)
    "PLR2004",# magic numbers (HTTP status codes etc.)
    "PLR0911",# too many return statements
    "PLR0915",# too many statements
    "SIM105", # contextlib.suppress style preference
    "S104",   # bind to all interfaces (normal for Docker)
    "S110",   # try-except-pass (best-effort operations)
    "S112",   # try-except-continue (best-effort operations)
    "TRY300", # try-else style preference
    "B007",   # unused loop variable
    "ASYNC230",# blocking I/O in async (file operations)
    "PTH",    # prefer pathlib (open() is used in sync helpers)
    "PLW0603",# global statement (singleton pattern, intentional)
    "PLW2901",# with-statement variable overwrite (Pillow pattern)
    "RUF012", # mutable class attribute (SQLAlchemy mapper_args)
    "RUF002", # docstring ambiguous chars
    "N806",   # variable naming (class-level imported names)
    "S103",   # chmod permissive mask (intentional local storage setup)
    "S314",   # XML parsing (input is already sanitized)
    "S603",   # subprocess call (sandboxed)
    "PLR0912",# too many branches
    "N818",   # exception naming convention
    "S105",   # hardcoded password string (enum values, schema defaults - false positive)
    "S106",   # hardcoded password (test fixtures, intentional)
    "TRY203", # re-raise exception handler (intentional for logging/cleanup)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "N802", "N803", "B011", "TRY"]
"app/migrations/**" = ["E", "F", "I", "N"]
"alembic/**" = ["E", "F", "I", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
    "archive/",
    "var/",
    "build/",
    "dist/",
    "alembic/versions/",
    "frontend/",
]

[[tool.mypy.overrides]]
module = [
    "pdf2image.*",
    "pypandoc.*",
    "weasyprint.*",
    "cairosvg.*",
    "ebooklib.*",
    "xlrd.*",
    "magic.*",
    "clamd.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services",
    "security: security-focused tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:passlib",
    "ignore::sqlalchemy.exc.SADeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/migrations/*",
    "app/main.py",
    "app/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", "alembic/versions", "archive"]
skips = ["B101"]  # assert used in tests

[tool.pip-audit]
strict = true
